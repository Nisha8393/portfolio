# Netlify build config for Next.js.
# publish = ".next" is required by @netlify/plugin-nextjs (the default of the
# repo root triggers a plugin error). The plugin applies the Next.js runtime
# (SSR routing, API routes, redirects).
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"
