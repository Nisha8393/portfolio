# Netlify build config for Next.js.
# Declaring the plugin explicitly guarantees Netlify installs & runs the
# Next.js runtime (SSR routing, API routes, redirects) instead of relying
# on auto-detection — which fixes root "Page not found" errors.
[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"
